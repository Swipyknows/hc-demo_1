[project]
name = "hc-demo-1"
version = "0.1.0"
description = "Embedded debugging copilot"
requires-python = ">=3.10"
dependencies = [
    "pygdbmi",
    "litellm",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
