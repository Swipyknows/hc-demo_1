[project]
name = "embedded-debugging-copilot"
version = "0.1.0"
description = "Agentic AI-based hardware-aware Embedded C debugging copilot"
requires-python = ">=3.10"
dependencies = [
    "pygdbmi",
    "litellm",
    "tenacity>=9.2.1",            # required by litellm for num_retries
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
